# Deploy the static export to GitHub Pages.
#
# The app is a pure static site — this workflow builds it and uploads the folder.
#
# The job is gated on the repository being public: GitHub Pages cannot be enabled
# for a private repository on the free plan, so without this guard every push to a
# private repo would produce a red failing run. It skips silently instead and starts
# working by itself the moment the repository is made public.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip while the repo is private; run on demand or once it is public.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Refuses to continue if the Impressum is incomplete. A publicly reachable
      # German-language site without one is a real legal exposure, so the deploy
      # path is gated rather than trusted to be remembered.
      - run: npm run check:legal
      - run: npm test
      - run: npm run verify
      - run: npm run build
        env:
          # Pages serves the project under /<repo>. Remove this once a custom
          # domain points at the site root.
          BASE_PATH: /facettn
      # Assertions on the emitted files, not the source: no 'unsafe-eval' leaking
      # from the dev-only CSP branch, a CSP on every page, no foreign host in it.
      - run: npm run check:build
        env:
          BASE_PATH: /facettn
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on via the API rather than requiring a manual setting.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
