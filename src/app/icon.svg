           fill="none" stroke="#6a68d8" stroke-width="1.1" stroke-linejoin="round"/>
  <polygon points="16,6.4 20.2,10.2 21.2,14.3 23.7,18.5 22.5,24.9 16,25.1 12.3,21.1 11.7,17.4 8.8,13.7 10.5,8.4"
           fill="#8f8def" fill-opacity="0.45" stroke="#b3b1f7" stroke-width="1.2" stroke-linejoin="round"/>
