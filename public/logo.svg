<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Facettn">
  <!-- Mark: decagon (ten profile axes) with radial facet lines and a profile
       polygon. Uses currentColor for the frame so it adapts to context. -->
  <g fill="none" stroke="currentColor" stroke-linejoin="round">
    <polygon points="16,3.6 23.3,5.9 27.8,12.1 27.8,19.9 23.3,26.1 16,28.4 8.7,26.1 4.2,19.9 4.2,12.1 8.7,5.9"
             stroke-width="1.1"/>
    <g stroke-width="0.5" opacity="0.4">
      <line x1="16" y1="16" x2="16" y2="3.6"/>
      <line x1="16" y1="16" x2="27.8" y2="12.1"/>
      <line x1="16" y1="16" x2="23.3" y2="26.1"/>
      <line x1="16" y1="16" x2="8.7" y2="26.1"/>
      <line x1="16" y1="16" x2="4.2" y2="12.1"/>
    </g>
  </g>
  <polygon points="16,6.4 20.2,10.2 21.2,14.3 23.7,18.5 22.5,24.9 16,25.1 12.3,21.1 11.7,17.4 8.8,13.7 10.5,8.4"
           fill="#4442c8" fill-opacity="0.14" stroke="#4442c8" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
